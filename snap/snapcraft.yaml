name: pawmate
version: 1.0.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-pawmate: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.pawmate # adjust accordingly to your app name

apps:
  pawmate:
    command: pawmate
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-pawmate
parts:
  pawmate:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
