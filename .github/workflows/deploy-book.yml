name: Deploy implementation book

on:
  push:
    branches:
      - main
    paths:
      - books/**
      - .github/workflows/deploy-book.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-implementation-book
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy mdBook
    runs-on: ubuntu-latest
    env:
      PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
      TARGET_REPOSITORY: pawmate-dev/pawmate-dev.github.io
    steps:
      - name: Check out Pawmate
        uses: actions/checkout@v6

      - name: Install mdBook
        run: cargo install mdbook --version 0.5.4 --locked

      - name: Build book
        run: mdbook build books

      - name: Check deployment credential
        run: |
          if [ -z "$PAGES_DEPLOY_TOKEN" ]; then
            echo "PAGES_DEPLOY_TOKEN must have contents: write access to $TARGET_REPOSITORY."
            exit 1
          fi

      - name: Check out Pages repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: pages

      - name: Update published book
        run: |
          rsync --archive --delete books/book/ pages/book/

      - name: Commit and push published book
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book
          if git diff --cached --quiet; then
            echo "The published book is already up to date."
            exit 0
          fi
          git commit -m "docs: deploy Pawmate implementation book"
          git push
